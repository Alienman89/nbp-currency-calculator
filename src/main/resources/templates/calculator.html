<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Walutowy NBP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light p-5">
<div class="container" style="max-width: 600px;">
    <h2 class="mb-4 text-center">💱 Kalkulator Walutowy NBP</h2>

    <div class="card bg-secondary text-light p-4 shadow">
        <form action="/calculate" method="post">
            <div class="mb-3">
                <label class="form-label">Kwota:</label>
                <input type="number" step="0.01" name="amount" th:value="${amount}" class="form-control" required>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label class="form-label">Z waluty:</label>
                    <select name="fromCode" class="form-select">
                        <option th:each="c : ${currencies}"
                                th:value="${c.code()}"
                                th:text="${c.code()}"
                                th:selected="${c.code() == fromCode}"></option>
                    </select>
                </div>
                <div class="col">
                    <label class="form-label">Na walutę:</label>
                    <select name="toCode" class="form-select">
                        <option th:each="c : ${currencies}"
                                th:value="${c.code()}"
                                th:text="${c.code()}"
                                th:selected="${c.code() == (toCode != null ? toCode : 'EUR')}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Prowizja Banku / Kantoru (%):</label>
                <input type="number" step="0.1" name="fee" th:value="${fee}" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">Oblicz Koszty i Przelicz</button>
        </form>

        <div th:if="${result}" class="mt-4 p-3 bg-dark rounded border border-success">
            <h4 class="text-success">Otrzymasz: <span th:text="${result}"></span> <span th:text="${toCode}"></span></h4>
            <p class="text-danger mb-0">Łączny ukryty koszt transakcji (Spread + Prowizja): <strong><span th:text="${totalCost}"></span> PLN</strong></p>
        </div>
    </div>
</div>
</body>
</html>
